name: Test and deploy to GitHub Pages

# Runs every test (including executing every problem's reference solution in Python)
# on pushes and pull requests, then publishes the site to GitHub Pages from `main`.
# One-time setup: repository Settings → Pages → Build and deployment → Source: "GitHub Actions".
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # same Python version as the in-browser Pyodide runtime
      - name: Install Python packages used by the exercises
        run: pip install numpy pandas scikit-learn
      - name: Graph, content, views and problem-solution tests
        run: npm test

  deploy:
    name: Deploy
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
