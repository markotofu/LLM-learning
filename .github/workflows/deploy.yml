name: Test and deploy to GitHub Pages

# On pushes and pull requests:
#   - Tests: content, theme contrast, views, and every problem's reference solution executed in Python;
#   - Browser tests: the app in a real browser (Playwright + Chromium), including the in-browser Python;
#   - Visual changes: screenshots of every demo and diagram compared with the previous commit (report only).
# Then the site is published to GitHub Pages from `main`, if the tests and browser tests passed.
# One-time setup: repository Settings → Pages → Build and deployment → Source: "GitHub Actions".
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # same Python version as the in-browser Pyodide runtime
      - name: Install Python packages used by the exercises
        run: pip install numpy pandas scikit-learn matplotlib
      - name: Graph, content, theme, views and problem-solution tests
        run: npm test

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npx playwright test --project=e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-report
          path: playwright-report/
          retention-days: 14

  visual:
    name: Visual changes (report only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Compare demos and diagrams with the previous version
        run: node tools/visual-diff.js ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'HEAD~1' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-changes
          path: playwright-report/
          retention-days: 14

  deploy:
    name: Deploy
    needs: [test, browser]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
