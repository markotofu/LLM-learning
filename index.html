<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Content-Security-Policy (GitHub Pages cannot send headers, so it lives here). Scripts only from this site and the
       jsDelivr mirrors that host Pyodide; no inline scripts, so injected markup cannot run code. 'unsafe-eval' is needed
       by Vue's in-browser template compiler, 'wasm-unsafe-eval' by Pyodide; blob: workers run the Python engine. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval' https://*.jsdelivr.net blob:; worker-src 'self' blob:; connect-src 'self' https: blob: data:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1012">
  <meta name="description" content="ML Atlas: an interactive mind map of machine learning, neural networks and large language models, with lessons, runnable Python, quizzes and coding problems that run in your browser.">
  <title>ML Atlas</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
  <script src="js/core/boot-theme.js"></script>
</head>
<body>
  <div id="app"><div style="padding:40px;font-family:system-ui;color:#a3a7b0">Loading ML Atlas…</div></div>
  <noscript>ML Atlas needs JavaScript enabled.</noscript>

  <!-- Framework (vendored: no build step, works on GitHub Pages and from file://) -->
  <script src="vendor/vue.global.prod.js"></script>

  <!-- Core -->
  <script src="js/core/util.js"></script>
  <script src="js/core/highlight.js"></script>
  <script src="js/core/store.js"></script>
  <script src="js/core/router.js"></script>
  <script src="js/core/ui.js"></script>

  <!-- Engines (framework independent, unit tested in Node) -->
  <script src="js/engines/graph.js"></script>
  <script src="js/engines/python.js"></script>
  <script src="js/engines/quiz.js"></script>
  <script src="js/engines/srs.js"></script>

  <!-- Content -->
  <script src="js/data/branches.js"></script>
  <script src="js/data/concepts-start-math.js"></script>
  <script src="js/data/concepts-python-data.js"></script>
  <script src="js/data/concepts-ml-core.js"></script>
  <script src="js/data/concepts-ml-more.js"></script>
  <script src="js/data/concepts-ml-unsup.js"></script>
  <script src="js/data/concepts-nn-core.js"></script>
  <script src="js/data/concepts-nn-more.js"></script>
  <script src="js/data/concepts-llm-core.js"></script>
  <script src="js/data/concepts-llm-more.js"></script>
  <script src="js/data/concepts-apps.js"></script>
  <script src="js/data/concepts-spec.js"></script>
  <script src="js/data/concepts-foundations-plus.js"></script>
  <script src="js/data/concepts-viz.js"></script>
  <script src="js/data/concepts-llm-plus.js"></script>
  <script src="js/data/concepts-spec-plus.js"></script>
  <script src="js/data/concepts-theory-plus.js"></script>
  <script src="js/data/concepts-practice-plus.js"></script>
  <script src="js/data/concepts-deep-plus.js"></script>
  <script src="js/data/concepts-frontier-plus.js"></script>
  <script src="js/data/concepts-capstones.js"></script>
  <script src="js/data/legacy-sections.js"></script>
  <script src="js/data/glossary.js"></script>
  <script src="js/data/tracks.js"></script>
  <script src="js/data/achievements.js"></script>
  <script src="js/data/legal.js"></script>

  <!-- Progress & gamification (after content) -->
  <script src="js/core/gamification.js"></script>
  <script src="js/core/progress.js"></script>
  <script src="js/core/mistakes.js"></script>

  <!-- Views -->
  <script src="js/views/components.js"></script>
  <script src="js/views/editor.js"></script>
  <script src="js/views/demos.js"></script>
  <script src="js/views/diagrams.js"></script>
  <script src="js/views/charts.js"></script>
  <script src="js/views/demos-more.js"></script>
  <script src="js/views/quiz-view.js"></script>
  <script src="js/views/map-view.js"></script>
  <script src="js/views/concept-view.js"></script>
  <script src="js/views/problem-view.js"></script>
  <script src="js/views/practice-view.js"></script>
  <script src="js/views/playground.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/pages.js"></script>
  <script src="js/views/profile.js"></script>
  <script src="js/views/legal.js"></script>
  <script src="js/app.js"></script>
  <script src="js/core/boot-sw.js"></script>
</body>
</html>
