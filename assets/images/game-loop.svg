<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="560" height="300" fill="#fbf8f1"/>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5b4a2e"/>
    </marker>
  </defs>
  <g text-anchor="middle">
    <rect x="40" y="110" width="140" height="70" rx="12" fill="#e8f0fb" stroke="#3b6aa8" stroke-width="2"/>
    <text x="110" y="140" font-size="18" font-weight="600" fill="#1f3b63">Input</text>
    <text x="110" y="163" font-size="13" fill="#1f3b63">keys, mouse, pad</text>
    <rect x="210" y="40" width="140" height="70" rx="12" fill="#eaf6ea" stroke="#3c8a3c" stroke-width="2"/>
    <text x="280" y="70" font-size="18" font-weight="600" fill="#1d4a1d">Update</text>
    <text x="280" y="93" font-size="13" fill="#1d4a1d">move, collide, AI</text>
    <rect x="380" y="110" width="140" height="70" rx="12" fill="#fbeee6" stroke="#b3622b" stroke-width="2"/>
    <text x="450" y="140" font-size="18" font-weight="600" fill="#6b3412">Render</text>
    <text x="450" y="163" font-size="13" fill="#6b3412">draw the frame</text>
  </g>
  <g fill="none" stroke="#5b4a2e" stroke-width="2.5" marker-end="url(#head)">
    <path d="M140 108 Q165 62 204 70"/>
    <path d="M352 75 Q402 72 428 106"/>
    <path d="M440 186 Q280 272 122 186"/>
  </g>
  <text x="280" y="262" font-size="14" text-anchor="middle" fill="#5b4a2e">one trip around the loop is one frame: about 16.7 ms at 60 fps</text>
</svg>
